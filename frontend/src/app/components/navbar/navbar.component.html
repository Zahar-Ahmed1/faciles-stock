<nav class="navbar">
  <div class="brand" (click)="goTo(auth.homePath())">
    <div class="logo">FX</div>
    <div class="brand-text">
      <h1>Facilyx</h1>
      <span class="sub">{{ roleLabel }}</span>
    </div>
  </div>

  <ul class="nav-links" *ngIf="auth.isAuthenticated">
    <li *ngFor="let item of navItems">
      <button
        type="button"
        class="nav-link"
        [class.active]="isActive(item.path)"
        (click)="goTo(item.path)"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </button>
    </li>
  </ul>

  <div class="right" *ngIf="auth.isAuthenticated">
    <div class="user-chip">
      <div class="avatar">{{ avatarInitials }}</div>
      <div class="user-meta">
        <span class="name">{{ userDisplayName }}</span>
        <span class="email">{{ auth.currentUser?.email }}</span>
      </div>
      <button
        type="button"
        class="logout-btn"
        (click)="logout()"
        title="Déconnexion"
      >
        ⏻
      </button>
    </div>
  </div>
</nav>
