name: CI

# Lecture seule : ce workflow ne pousse sur aucune branche, y compris celle en production.
permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Interface Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Compiler la version de production
        run: npm run build

  backend:
    name: API PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Vérifier composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Installer les dépendances
        run: composer update --no-dev --no-interaction --prefer-dist --no-progress

      - name: Vérifier la syntaxe PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
