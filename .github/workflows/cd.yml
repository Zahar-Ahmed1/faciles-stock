name: CD

# Lecture seule. Ne se lance pas sur main, master ni prod : la branche en production n'est pas déployée.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  package:
    name: Préparer et envoyer public_html
    if: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name != 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compiler l'interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assembler les fichiers du site
        run: |
          mkdir -p dist-host/public_html/api
          cp -R frontend/dist/facility-stock-frontend/. dist-host/public_html/
          cp deploy/public_html/.htaccess dist-host/public_html/
          cp deploy/public_html/api/.htaccess deploy/public_html/api/index.php deploy/public_html/api/backend-path.php dist-host/public_html/api/
          test ! -f dist-host/public_html/.env
          test ! -d dist-host/public_html/facilty-api

      - uses: actions/upload-artifact@v4
        with:
          name: facilyx-public_html
          path: dist-host/public_html
          retention-days: 14

      - name: Vérifier les secrets FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTP_SERVER est absent. Le site n'est pas envoyé. L'archive reste dans Actions."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "dir=${FTP_SERVER_DIR:-public_html/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Envoyer Facilyx sur Hostinger
        if: steps.ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist-host/public_html/
          server-dir: ${{ steps.ftp.outputs.dir }}
          dangerous-clean-slate: false
          log-level: minimal
          timeout: 120000
